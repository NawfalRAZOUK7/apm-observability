# Argo CD Application — LOCAL variant for a self-contained demo / screenshot.
#
# Differences vs application.yaml:
#   - uses a locally-built image (apm-web:local) instead of GHCR, so no release
#     image is required;
#   - runs the in-cluster TimescaleDB (postgres.enabled=true) — the platform's
#     one and only backend — so the local demo behaves exactly like production.
#
# Argo CD syncs the Helm chart FROM Git (deploy/helm on the tracked branch).
# `bootstrap.sh` overwrites `targetRevision` below with your current branch and can
# push it for you (PUSH=1). Applied directly, it tracks the value set here (main).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apm-observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/NawfalRAZOUK7/apm-observability.git
    targetRevision: main
    path: deploy/helm/apm-observability
    helm:
      parameters:
        - name: image.repository
          value: apm-web
        - name: image.tag
          value: local
        - name: image.pullPolicy
          value: IfNotPresent
        - name: postgres.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: apm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
