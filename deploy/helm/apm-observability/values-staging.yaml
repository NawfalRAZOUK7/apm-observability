# Staging overrides (Track A). Applied on top of values.yaml.
replicaCount: 1

config:
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,apm-staging.local"
  OTEL_ENABLED: "1"

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: "500m"
    memory: 384Mi

# Self-contained TimescaleDB is convenient for staging.
postgres:
  enabled: true

ingress:
  enabled: true
  hosts:
    - host: apm-staging.local
      paths:
        - path: /
          pathType: Prefix
