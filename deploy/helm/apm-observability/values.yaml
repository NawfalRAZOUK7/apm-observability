# Default values for the apm-observability chart.

replicaCount: 1

image:
  # Built and pushed by .github/workflows/release.yml
  repository: ghcr.io/nawfalrazouk7/apm-observability
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Non-secret application configuration (rendered into a ConfigMap).
config:
  DJANGO_DEBUG: "0"
  # Kubelet probes hit the pod IP; we pin a Host header (see deployment) so this
  # can stay tight. Add your Ingress host here too.
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
  DJANGO_TIME_ZONE: "UTC"
  DRF_PAGE_SIZE: "50"
  DB_SSLMODE: "disable"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "apm"
  POSTGRES_USER: "apm"
  # Distributed tracing (point at an in-cluster OTel Collector when available).
  OTEL_ENABLED: "0"
  OTEL_SERVICE_NAME: "apm-observability"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  DJANGO_LOG_LEVEL: "INFO"

# Secret values (rendered into a Secret). Override via --set or a values file /
# an external secret manager in real environments.
secrets:
  DJANGO_SECRET_KEY: "change-me-in-production"
  POSTGRES_PASSWORD: "apm"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: apm.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

# Optional in-cluster TimescaleDB for a self-contained kind/minikube demo.
# In production set postgres.enabled=false and point config.POSTGRES_HOST at a
# managed database.
postgres:
  enabled: true
  host: ""              # if empty and enabled, defaults to <release>-postgres
  image: timescale/timescaledb:latest-pg16
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

podAnnotations:
  # Scraped by Prometheus (matches the app's /metrics endpoint).
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8000"

nodeSelector: {}
tolerations: []
affinity: {}
