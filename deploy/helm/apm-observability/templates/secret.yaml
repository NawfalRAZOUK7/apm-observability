{{- /*
  Only create a Secret when NOT using an externally-managed one. With an external
  secrets manager (External Secrets Operator, Sealed Secrets, or SOPS) set
  `existingSecret` to the name it produces and the chart won't render this.
  Empty values are skipped so no placeholder secret is ever forced into the app.
*/ -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apm.fullname" . }}-secret
  labels:
    {{- include "apm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
