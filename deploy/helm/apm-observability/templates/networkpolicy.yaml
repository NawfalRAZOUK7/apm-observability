{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "apm.fullname" . }}
  labels:
    {{- include "apm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "apm.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP to the app only from the permitted namespace (e.g. the ingress
    # controller); everything else is denied by default.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS resolution.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres.
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgresPort }}
{{- end }}
