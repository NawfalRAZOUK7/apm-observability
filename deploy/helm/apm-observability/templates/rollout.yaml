{{- if .Values.rollout.enabled }}
# Progressive delivery via Argo Rollouts (Phase 17). Canary steps interleave with
# a Prometheus AnalysisTemplate that auto-aborts the rollout if the canary
# breaches the SLO. Pod spec mirrors the Deployment (kept off when this is on).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "apm.fullname" . }}
  labels:
    {{- include "apm.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "apm.webSelectorLabels" . | nindent 6 }}
  strategy:
    canary:
      analysis:
        templates:
          - templateName: {{ include "apm.fullname" . }}-canary
        startingStep: 1
        args:
          - name: service
            value: {{ include "apm.fullname" . }}
          # The canary ReplicaSet's pod-template-hash, so the AnalysisTemplate
          # scopes its Prometheus queries to the NEW pods only (not the whole
          # Service). Requires the app metrics to carry a matching
          # rollouts_pod_template_hash label — see the PodMonitor below.
          - name: pod-template-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        {{- range .Values.rollout.steps }}
        - setWeight: {{ .setWeight }}
        - pause: { duration: {{ .pause }} }
        {{- end }}
  template:
    metadata:
      labels:
        {{- include "apm.webSelectorLabels" . | nindent 8 }}
      annotations:
        # Roll the canary when the rendered config/secret change (a config-only
        # edit otherwise wouldn't trigger a new revision, leaving pods on the old
        # config while migrations target the new DB).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "apm.fullname" . }}-config
            - secretRef:
                name: {{ include "apm.secretName" . }}
          env:
            {{- include "apm.runtimeEnv" . | nindent 12 }}
          readinessProbe:
            # ?db=1 gates readiness on DB connectivity (SELECT 1 -> 503) so a pod
            # isn't added to the Service until the database is reachable. Checks
            # connectivity, not whether migrations are applied. Liveness stays
            # shallow (no restart storm on a transient DB blip).
            httpGet:
              path: /api/health/?db=1
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
