{{- if .Values.migrations.enabled }}
# Runs Django migrations ONCE per release. A single Job — not an initContainer —
# because an initContainer runs on every replica/canary pod and Django migrations
# are not safe to run concurrently. Maps to an ArgoCD PreSync hook under GitOps.
#
# post-install, NOT pre-install: a pre-install hook runs before the release's
# normal resources exist, so the Job would start with no ConfigMap/Secret to read
# ("configmap not found") and — with postgres.enabled=true — no database to
# migrate at all. pre-upgrade is kept, which is the path that actually matters:
# the schema is migrated before the new app version rolls out.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "apm.fullname" . }}-migrate
  labels:
    {{- include "apm.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "apm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Wait for the DB rather than trusting ordering: without helm --wait the
          # post-install hook can fire while the bundled Postgres is still starting,
          # and backoffLimit retries would be exhausted before it accepts
          # connections. activeDeadlineSeconds bounds the wait.
          command: ["sh", "-c"]
          args:
            - |
              until python -c "import os,socket; socket.create_connection((os.environ['POSTGRES_HOST'], int(os.environ['POSTGRES_PORT'])), 2)" 2>/dev/null; do
                echo "waiting for ${POSTGRES_HOST}:${POSTGRES_PORT} ..."
                sleep 2
              done
              exec python manage.py migrate --noinput
          # DB connection injected from the CURRENT chart values. A Helm
          # pre-upgrade hook runs BEFORE the new ConfigMap is applied, so envFrom
          # alone would read the PREVIOUS revision's DB host — migrating the old
          # database. These explicit vars override envFrom (env beats envFrom for
          # the same key), so migrations always target the new DB. Residual edge:
          # a password rotated in the SAME upgrade still reads old (see
          # docs/PROGRESSIVE_DELIVERY.md).
          env:
            - name: POSTGRES_HOST
              value: {{ include "apm.postgresHost" . | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.config.POSTGRES_PORT | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.config.POSTGRES_DB | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.config.POSTGRES_USER | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.config.DB_SSLMODE | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "apm.fullname" . }}-config
            - secretRef:
                name: {{ include "apm.secretName" . }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
