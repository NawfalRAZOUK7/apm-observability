{{- if .Values.postgres.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "apm.fullname" . }}-postgres
  labels:
    {{- include "apm.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apm.fullname" . }}-postgres
  labels:
    {{- include "apm.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "apm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "apm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      # Hardened to satisfy the restricted PSS + Kyverno policies (Phase 16).
      # The image is Alpine-based, so postgres is uid/gid 70; fsGroup lets it own
      # the mounted volume, and PGDATA points at a subdirectory so the mount
      # root's ownership doesn't block initdb when running non-root.
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.postgres.runAsUser }}
        runAsGroup: {{ .Values.postgres.runAsUser }}
        fsGroup: {{ .Values.postgres.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.config.POSTGRES_DB | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.config.POSTGRES_USER | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "apm.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.config.POSTGRES_USER | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.config.POSTGRES_USER | quote }}]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "apm.fullname" . }}-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apm.fullname" . }}-postgres
  labels:
    {{- include "apm.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  selector:
    {{- include "apm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
{{- end }}
