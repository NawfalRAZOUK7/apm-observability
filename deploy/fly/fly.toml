# Fly.io config for a slim, public demo of the web app + dashboard.
# This deploys the Django/DRF app only; it connects to a TimescaleDB running as a
# separate Fly app (see deploy/fly/README.md). It is intentionally NOT the full
# LGTM stack — just enough to give reviewers a live dashboard URL.
#
#   fly launch --no-deploy --copy-config --name apm-observability-demo
#   fly deploy
#
# Rename `app` to your own unique Fly app name.

app = "apm-observability-demo"
primary_region = "cdg"

[build]
  dockerfile = "../../Dockerfile"

[env]
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "apm-observability-demo.fly.dev,.internal,localhost,127.0.0.1"
  DJANGO_SECURE_SSL_REDIRECT = "0"   # Fly terminates TLS at the edge (force_https below)
  DJANGO_TIME_ZONE = "UTC"
  POSTGRES_PORT = "5432"
  POSTGRES_DB = "apm"
  GUNICORN_WORKERS = "2"
  # POSTGRES_HOST / POSTGRES_USER / POSTGRES_PASSWORD / DJANGO_SECRET_KEY are set
  # as secrets: `fly secrets set ...` (see deploy/fly/README.md).

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true    # scale to zero when idle → stays in the free allowance
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [[http_service.checks.http]]
      path = "/api/health/"
      interval = "15s"
      timeout = "3s"
      grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
