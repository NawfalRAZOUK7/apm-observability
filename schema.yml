openapi: 3.0.3
info:
  title: APM Observability API
  version: 1.0.0
  description: 'Application Performance Monitoring backend: batch ingestion of API
    request events, time-series analytics (hourly/daily aggregates, KPIs, top endpoints),
    and semantic search over errors.'
paths:
  /api/alerting/rules/:
    get:
      operationId: api_alerting_rules_list
      description: |-
        Tenant-scoped CRUD for alert rules.

        Reads require viewer+, writes require developer+ (HasMinimumRole default).
        Rules are visible/editable only within the caller's organizations.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertRuleList'
          description: ''
    post:
      operationId: api_alerting_rules_create
      description: |-
        Tenant-scoped CRUD for alert rules.

        Reads require viewer+, writes require developer+ (HasMinimumRole default).
        Rules are visible/editable only within the caller's organizations.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
          description: ''
  /api/alerting/rules/{id}/:
    get:
      operationId: api_alerting_rules_retrieve
      description: |-
        Tenant-scoped CRUD for alert rules.

        Reads require viewer+, writes require developer+ (HasMinimumRole default).
        Rules are visible/editable only within the caller's organizations.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
          description: ''
    put:
      operationId: api_alerting_rules_update
      description: |-
        Tenant-scoped CRUD for alert rules.

        Reads require viewer+, writes require developer+ (HasMinimumRole default).
        Rules are visible/editable only within the caller's organizations.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
          description: ''
    patch:
      operationId: api_alerting_rules_partial_update
      description: |-
        Tenant-scoped CRUD for alert rules.

        Reads require viewer+, writes require developer+ (HasMinimumRole default).
        Rules are visible/editable only within the caller's organizations.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAlertRuleRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
          description: ''
    delete:
      operationId: api_alerting_rules_destroy
      description: |-
        Tenant-scoped CRUD for alert rules.

        Reads require viewer+, writes require developer+ (HasMinimumRole default).
        Rules are visible/editable only within the caller's organizations.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/alerting/rules/{id}/evaluate/:
    post:
      operationId: api_alerting_rules_evaluate_create
      description: Evaluate this rule immediately (useful for testing a rule).
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
          description: ''
  /api/anomalies/:
    get:
      operationId: api_anomalies_retrieve
      description: Robust (median/MAD) anomaly detection over API request latency
        and error rate, per service+endpoint.
      parameters:
      - in: query
        name: bucket
        schema:
          type: string
        description: minute | hour | day (default hour).
      - in: query
        name: endpoint
        schema:
          type: string
      - in: query
        name: project
        schema:
          type: string
        description: Project slug.
      - in: query
        name: service
        schema:
          type: string
      - in: query
        name: since
        schema:
          type: string
        description: 'ISO datetime/date (default: 24h ago).'
      - in: query
        name: until
        schema:
          type: string
        description: 'ISO datetime/date (default: now).'
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/dora/deployments/:
    get:
      operationId: api_dora_deployments_list
      description: |-
        Record a deployment (POST, called by CD) or list recent ones (GET).

        Unauthenticated for internal pipeline use; protect with an ingest key or
        network policy in production.
      parameters:
      - in: query
        name: environment
        schema:
          type: string
          enum:
          - development
          - production
          - staging
        description: |-
          * `production` - production
          * `staging` - staging
          * `development` - development
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - failed
          - rolled_back
          - success
        description: |-
          * `success` - success
          * `failed` - failed
          * `rolled_back` - rolled_back
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeploymentList'
          description: ''
    post:
      operationId: api_dora_deployments_create
      description: |-
        Record a deployment (POST, called by CD) or list recent ones (GET).

        Unauthenticated for internal pipeline use; protect with an ingest key or
        network policy in production.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
          description: ''
  /api/dora/metrics/:
    get:
      operationId: api_dora_metrics_retrieve
      description: The four DORA metrics + Elite/High/Medium/Low bands over a window.
      parameters:
      - in: query
        name: environment
        schema:
          type: string
        description: production|staging|development.
      - in: query
        name: project
        schema:
          type: string
        description: Project slug.
      - in: query
        name: since
        schema:
          type: string
        description: ISO datetime/date (default 30d ago).
      - in: query
        name: until
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/health/:
    get:
      operationId: api_health_retrieve
      description: |-
        GET /api/health/
        Optional DB check: /api/health/?db=1  (or db=true/yes/on)
      summary: Liveness/readiness health check
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/issues/:
    get:
      operationId: api_issues_retrieve
      description: Grouped errors ranked by count.
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/nl-query/:
    get:
      operationId: api_nl_query_retrieve
      description: |-
        Natural-language telemetry query (Phase 13).

        ``?q=error rate for checkout in the last 6 hours`` -> parsed params + result.
        Uses an LLM when configured, otherwise a keyword heuristic (both $0-capable).
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Natural-language question.
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/requests/:
    get:
      operationId: api_requests_list
      parameters:
      - in: query
        name: endpoint
        schema:
          type: string
      - in: query
        name: latency_max
        schema:
          type: integer
      - in: query
        name: latency_min
        schema:
          type: integer
      - in: query
        name: latency_ms
        schema:
          type: integer
      - in: query
        name: method
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: service
        schema:
          type: string
      - in: query
        name: status_code
        schema:
          type: integer
      - in: query
        name: status_code__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: time_after
        schema:
          type: string
          format: date-time
      - in: query
        name: time_before
        schema:
          type: string
          format: date-time
      - in: query
        name: trace_id
        schema:
          type: string
      - in: query
        name: user_ref
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApiRequestList'
          description: ''
    post:
      operationId: api_requests_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRequest'
          description: ''
  /api/requests/{id}/:
    get:
      operationId: api_requests_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this api request.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRequest'
          description: ''
    put:
      operationId: api_requests_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this api request.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRequest'
          description: ''
    patch:
      operationId: api_requests_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this api request.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApiRequestRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRequest'
          description: ''
    delete:
      operationId: api_requests_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this api request.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/requests/daily/:
    get:
      operationId: api_requests_daily_retrieve
      summary: Daily aggregated metrics
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/requests/hourly/:
    get:
      operationId: api_requests_hourly_retrieve
      summary: Hourly aggregated metrics
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/requests/ingest/:
    post:
      operationId: api_requests_ingest_create
      summary: Bulk-ingest API request events
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ApiRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/requests/kpis/:
    get:
      operationId: api_requests_kpis_retrieve
      summary: KPIs (requests, error rate, latency)
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/requests/semantic-search/:
    get:
      operationId: api_requests_semantic_search_retrieve
      summary: Semantic search over errors (pgvector)
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/requests/top-endpoints/:
    get:
      operationId: api_requests_top_endpoints_retrieve
      summary: Top endpoints by hits/errors/latency
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/service-map/:
    get:
      operationId: api_service_map_retrieve
      description: 'Service map: nodes, dependency edges with rate/error/latency,
        critical path, and period-over-period deltas.'
      parameters:
      - in: query
        name: project
        schema:
          type: string
        description: Project slug to scope to.
      - in: query
        name: since
        schema:
          type: string
        description: 'ISO datetime/date (default: 1h ago).'
      - in: query
        name: until
        schema:
          type: string
        description: 'ISO datetime/date (default: now).'
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/tenancy/auth/token/:
    post:
      operationId: api_tenancy_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/tenancy/auth/token/refresh/:
    post:
      operationId: api_tenancy_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/tenancy/auth/token/verify/:
    post:
      operationId: api_tenancy_auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/tenancy/projects/:
    get:
      operationId: api_tenancy_projects_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectList'
          description: ''
  /api/tenancy/projects/{project_id}/keys/:
    get:
      operationId: api_tenancy_projects_keys_list
      description: List keys for a project, or mint a new one (returned in plaintext
        once).
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
          description: ''
    post:
      operationId: api_tenancy_projects_keys_create
      description: List keys for a project, or mint a new one (returned in plaintext
        once).
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          description: No response body
  /api/tenancy/projects/{project_id}/keys/{key_id}/revoke/:
    post:
      operationId: api_tenancy_projects_keys_revoke_create
      parameters:
      - in: path
        name: key_id
        schema:
          type: integer
        required: true
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/tenancy/projects/{project_id}/keys/{key_id}/rotate/:
    post:
      operationId: api_tenancy_projects_keys_rotate_create
      parameters:
      - in: path
        name: key_id
        schema:
          type: integer
        required: true
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/tenancy/projects/{project_id}/usage/:
    get:
      operationId: api_tenancy_projects_usage_retrieve
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/traces/:
    get:
      operationId: api_traces_retrieve
      description: Recent trace summaries (Phase 12) for the UI trace list.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: string
      - in: query
        name: since
        schema:
          type: string
      - in: query
        name: until
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/traces/{trace_id}/:
    get:
      operationId: api_traces_retrieve_2
      description: All spans of one trace with waterfall offsets (Phase 12).
      parameters:
      - in: path
        name: trace_id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /sink/:
    get:
      operationId: sink_list
      description: Recent notifications (the dashboard-only channel + audit trail).
      parameters:
      - in: query
        name: alertname
        schema:
          type: string
      - in: query
        name: delivered
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - critical
          - info
          - unknown
          - warning
        description: |-
          * `critical` - critical
          * `warning` - warning
          * `info` - info
          * `unknown` - unknown
      - in: query
        name: status
        schema:
          type: string
          enum:
          - firing
          - resolved
        description: |-
          * `firing` - firing
          * `resolved` - resolved
      tags:
