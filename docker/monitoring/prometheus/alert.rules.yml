groups:
  - name: apm-alerts
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.job }} is down"
          description: "{{ $labels.instance }} has not responded for at least 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]))
          / sum(rate(django_http_responses_total_by_status_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx error rate is above 5%"
          description: "The Django HTTP 5xx error rate has exceeded 5% for 5 minutes."

      - alert: HighRequestLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(django_http_requests_latency_seconds_by_view_method_bucket[5m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP request latency P95 is above 1s"
          description: "The Django request latency P95 has exceeded 1 second for 5 minutes."

      - alert: NodeHighCpu
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node CPU usage is above 85% on {{ $labels.instance }}"
          description: "Average non-idle CPU usage has exceeded 85% for 10 minutes."

  # -------------------------------------------------------------------------
  # SLO: availability 99.5% (error budget = 0.5%).
  # Multi-window, multi-burn-rate alerts (Google SRE workbook style):
  #   - fast burn  -> page   (14.4x budget over 1h AND 5m)
  #   - slow burn  -> ticket (6x budget over 6h AND 30m)
  # -------------------------------------------------------------------------
  - name: apm-slo
    rules:
      - alert: SLOAvailabilityFastBurn
        expr: |
          (
            sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]))
            / sum(rate(django_http_responses_total_by_status_total[5m]))
          ) > (14.4 * 0.005)
          and
          (
            sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[1h]))
            / sum(rate(django_http_responses_total_by_status_total[1h]))
          ) > (14.4 * 0.005)
        for: 2m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "Fast error-budget burn (availability SLO 99.5%)"
          description: "5xx error ratio is burning the error budget >14.4x over 1h and 5m windows."

      - alert: SLOAvailabilitySlowBurn
        expr: |
          (
            sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[30m]))
            / sum(rate(django_http_responses_total_by_status_total[30m]))
          ) > (6 * 0.005)
          and
          (
            sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[6h]))
            / sum(rate(django_http_responses_total_by_status_total[6h]))
          ) > (6 * 0.005)
        for: 15m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "Slow error-budget burn (availability SLO 99.5%)"
          description: "5xx error ratio is burning the error budget >6x over 6h and 30m windows."
