# ============================================================================
# docker/docker-compose.yml
# Main app stack (Django + TimescaleDB + Nginx)
# ============================================================================

services:
  db:
    build:
      context: ..
      dockerfile: docker/db/Dockerfile
    image: apm-db

    env_file:
      - ../.env.docker

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apm}
      POSTGRES_USER: ${POSTGRES_USER:-apm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apm}

      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-apm_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-apm_app_pass}
      POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER:-apm_reader}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-apm_reader_pass}

    ports:
      - "${MAIN_DB_HOST_PORT:-5432}:5432"

    volumes:
      - db_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-apm} -d ${POSTGRES_DB:-apm}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped
    networks:
      - app_network

  web:
    build:
      context: ..
      dockerfile: Dockerfile

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - ../.env.docker

    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}

      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-apm}
      POSTGRES_USER: ${POSTGRES_USER:-apm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apm}

      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-UTC}
      DRF_PAGE_SIZE: ${DRF_PAGE_SIZE:-50}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      GUNICORN_BIND: ${GUNICORN_BIND:-0.0.0.0:8000}

      # Distributed tracing (OpenTelemetry -> Collector -> Tempo)
      OTEL_ENABLED: ${OTEL_ENABLED:-1}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-apm-observability}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}

      # Alert delivery providers (Phase 4). Defaults are free/local (console).
      # Flip to slack/discord/ntfy and set the matching URL to go live.
      CHAT_PROVIDER: ${CHAT_PROVIDER:-console}
      PAGER_PROVIDER: ${PAGER_PROVIDER:-console}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-apm-alerts}

      # Embeddings provider (Phase 8). Default free/offline via Ollama.
      EMBED_PROVIDER: ${EMBED_PROVIDER:-local}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}

    ports:
      - "${MAIN_WEB_HOST_PORT:-8000}:8000"

    entrypoint: ["bash", "docker/entrypoint.sh"]
    restart: unless-stopped
    networks:
      - app_network

  # Alert-rule evaluator (Phase 10). Continuously evaluates enabled tenant rules
  # and routes firings through the sink -> incident pipeline. Opt-in:
  #   docker compose --profile scheduler up -d rule-scheduler
  rule-scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    profiles:
      - scheduler
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env.docker
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-apm}
      POSTGRES_USER: ${POSTGRES_USER:-apm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apm}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-console}
      PAGER_PROVIDER: ${PAGER_PROVIDER:-console}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      RULE_EVAL_INTERVAL: ${RULE_EVAL_INTERVAL:-60}
    entrypoint: ["bash", "-lc"]
    command: ["python manage.py evaluate_alert_rules --loop --interval ${RULE_EVAL_INTERVAL:-60}"]
    restart: unless-stopped
    networks:
      - app_network

  # Native OTLP/gRPC receiver on :4317 (Phase 11). Opt-in:
  #   docker compose --profile otlp-grpc up -d otlp-grpc
  otlp-grpc:
    build:
      context: ..
      dockerfile: Dockerfile
    profiles:
      - otlp-grpc
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env.docker
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_DB: ${POSTGRES_DB:-apm}
      POSTGRES_USER: ${POSTGRES_USER:-apm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apm}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
    entrypoint: ["bash", "-lc"]
    command: ["python manage.py otlp_grpc_server --port 4317"]
    ports:
      - "${OTLP_GRPC_HOST_PORT:-4317}:4317"
    restart: unless-stopped
    networks:
      - app_network

  nginx:
    image: nginx:alpine

    depends_on:
      - web

    ports:
      - "${MAIN_NGINX_HTTP_HOST_PORT:-8080}:80"
      - "${MAIN_NGINX_HTTPS_HOST_PORT:-8443}:443"

    volumes:
      - ../docker/certs:/etc/nginx/certs:ro
      - ../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_webroot:/var/www/certbot:ro

    restart: unless-stopped
    networks:
      - app_network

  certbot:
    image: certbot/certbot:latest
    profiles:
      - production
    volumes:
      - ../docker/certs:/etc/nginx/certs:rw
      - certbot_webroot:/var/www/certbot:rw
      - certbot_config:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus/prometheus.simple.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - app_network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    networks:
      - app_network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      # Track B: expose DR verification metrics written by verify_restore.sh.
      - "--collector.textfile.directory=/textfile"
    volumes:
      - ./monitoring/node-exporter-textfile:/textfile:ro
    networks:
      - app_network
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_READONLY_USER:-apm_reader}:${POSTGRES_READONLY_PASSWORD:-apm_reader_pass}@db:5432/${POSTGRES_DB:-apm}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: apm_grafana
    ports:
      - "33000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      # Variables consumed by grafana/provisioning/datasources/datasources.yml.
      # In the single-node stack the DB is simply the `db` service on port 5432.
      DATA_NODE_IP: db
      CLUSTER_DATA_DB_HOST_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-apm}
      POSTGRES_READONLY_USER: ${POSTGRES_READONLY_USER:-apm_reader}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-apm_reader_pass}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    depends_on:
      - db
      - prometheus
      - tempo
      - loki
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - app_network

  # --- Distributed tracing (3rd pillar): OTel Collector -> Tempo ---
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - app_network
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - tempo
    networks:
      - app_network
    restart: unless-stopped

  # --- Logs (2nd pillar): Promtail -> Loki ---
  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - app_network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.2
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - app_network
    restart: unless-stopped

  # Free/offline embeddings backend (Phase 8). Opt-in:
  #   docker compose --profile embeddings up -d ollama
  #   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    profiles:
      - embeddings
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    networks:
      - app_network
    restart: unless-stopped

volumes:
  db_data:
  certbot_webroot:
  certbot_config:
  grafana_data:
  prometheus_data:
  tempo_data:
  loki_data:
  ollama_data:

networks:
  app_network:
    driver: bridge
