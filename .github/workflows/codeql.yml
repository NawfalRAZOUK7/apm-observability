name: CodeQL

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  codeql-preflight:
    name: CodeQL Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Python project markers
        run: |
          test -f manage.py
          test -f requirements.txt

  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: codeql-preflight

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: python
          queries: +security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:python"

  codeql-status:
    name: CodeQL Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - codeql-preflight
      - analyze
    if: always()

    steps:
      - name: Summarize CodeQL graph
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: meta["result"]
              for name, meta in needs.items()
              if meta["result"] != "success"
          }

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## CodeQL job graph\n\n")
              summary.write("| Job | Result |\n| --- | --- |\n")
              for name, meta in sorted(needs.items()):
                  summary.write(f"| `{name}` | `{meta['result']}` |\n")

          if failed:
              print("Failing CodeQL jobs:", failed)
              sys.exit(1)
          PY
