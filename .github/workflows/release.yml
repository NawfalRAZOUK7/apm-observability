name: Release container image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Build and security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # The Helm chart's appVersion is the default deployed image tag, so it must
      # match the released tag. Fail the release if they drift (keeps chart +
      # image versions honest without a bot commit).
      - name: Assert Chart appVersion matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          appv="$(grep -E '^appVersion:' deploy/helm/apm-observability/Chart.yaml | sed 's/.*"\(.*\)".*/\1/')"
          echo "tag=$tag  chart appVersion=$appv"
          if [ "$tag" != "$appv" ]; then
            echo "::error::Chart.yaml appVersion ($appv) != release tag ($tag). Bump appVersion before tagging." && exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build scan candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: apm-observability:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Block critical or high known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: apm-observability:release-candidate
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

  publish:
    name: Build, verify, and publish
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Normalize container image name
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=APM Observability
            org.opencontainers.image.description=Django APM backend powered by PostgreSQL and TimescaleDB
            org.opencontainers.image.licenses=MIT

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Generate GitHub build attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # Pin cosign 2.x: it writes the legacy `sha256-<digest>.sig` signature
          # tag. cosign 3.x defaults to OCI 1.1 referrers / new-bundle format,
          # which the Kyverno 1.18 verifyImages policy (infra/policy/kyverno/
          # verify-image-signatures.yaml) cannot find ("no signatures found").
          cosign-release: v2.4.3

      - name: Sign image using GitHub OIDC
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
