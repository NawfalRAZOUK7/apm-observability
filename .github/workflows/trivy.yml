name: Trivy

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  build-image:
    name: Build image artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image tarball
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: apm-web:ci
          outputs: type=docker,dest=/tmp/apm-web-ci.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apm-web-ci-image
          path: /tmp/apm-web-ci.tar
          retention-days: 1

  image-vulnerability-scan:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-image

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apm-web-ci-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/apm-web-ci.tar

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: apm-web:ci
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload image SARIF to code scanning
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  filesystem-config-scan:
    name: Filesystem and config scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-image

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Trivy filesystem/config scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload filesystem SARIF to code scanning
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

  image-sbom:
    name: Image SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-image

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apm-web-ci-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/apm-web-ci.tar

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: apm-web:ci
          format: cyclonedx
          output: apm-web-image.cdx.json

      - name: Upload image SBOM
        if: always() && hashFiles('apm-web-image.cdx.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apm-web-image-sbom
          path: apm-web-image.cdx.json

  trivy-status:
    name: Trivy Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build-image
      - image-vulnerability-scan
      - filesystem-config-scan
      - image-sbom
    if: always()

    steps:
      - name: Summarize Trivy graph
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: meta["result"]
              for name, meta in needs.items()
              if meta["result"] != "success"
          }

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Trivy job graph\n\n")
              summary.write("| Job | Result |\n| --- | --- |\n")
              for name, meta in sorted(needs.items()):
                  summary.write(f"| `{name}` | `{meta['result']}` |\n")

          if failed:
              print("Failing Trivy jobs:", failed)
              sys.exit(1)
          PY
