name: Trivy

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  build-image:
    name: Build image artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image tarball
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: apm-web:ci
          outputs: type=docker,dest=/tmp/apm-web-ci.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apm-web-ci-image
          path: /tmp/apm-web-ci.tar
          retention-days: 1

  image-vulnerability-scan:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-image

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apm-web-ci-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/apm-web-ci.tar

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: apm-web:ci
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload image SARIF to code scanning
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  filesystem-config-scan:
    name: Filesystem and config scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-image

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Trivy filesystem/config scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload filesystem SARIF to code scanning
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

  image-sbom:
    name: Image SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-image

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apm-web-ci-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/apm-web-ci.tar

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: apm-web:ci
          format: cyclonedx
          output: apm-web-image.cdx.json

      - name: Upload image SBOM
        if: always() && hashFiles('apm-web-image.cdx.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apm-web-image-sbom
          path: apm-web-image.cdx.json

  trivy-status:
    name: Trivy Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build-image
      - image-vulnerability-scan
      - filesystem-config-scan
      - image-sbom
    if: always()

    steps:
      - name: Summarize Trivy graph
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: meta["result"]
              for name, meta in needs.items()
              if meta["result"] != "success"
          }

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Trivy job graph\n\n")
              summary.write("| Job | Result |\n| --- | --- |\n")
              for name, meta in sorted(needs.items()):
                  summary.write(f"| `{name}` | `{meta['result']}` |\n")

          if failed:
              print("Failing Trivy jobs:", failed)
              sys.exit(1)
          PY
