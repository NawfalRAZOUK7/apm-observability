name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: "ci-not-secret"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
  DJANGO_TIME_ZONE: "UTC"
  DRF_PAGE_SIZE: "50"
  DB_SSLMODE: "disable"
  DB_CONN_MAX_AGE: "0"

jobs:
  preflight:
    name: Preflight (install + checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.in

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Basic diagnostics
        run: |
          set -euxo pipefail
          python -V
          pip -V
          pip freeze | sed -n '1,200p'

      - name: Select CI settings module (committed apm_platform/ci_settings.py)
        run: echo "DJANGO_SETTINGS_MODULE=apm_platform.ci_settings" >> "$GITHUB_ENV"

      - name: Django system check
        run: |
          set -euxo pipefail
          python manage.py check

      - name: Migrations must be committed (no pending makemigrations)
        run: |
          set -euxo pipefail
          python manage.py makemigrations --check --dry-run

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.in

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: |
          set -euxo pipefail
          ruff check .

  format-check:
    name: Format Check (black)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.in

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Black
        run: |
          set -euxo pipefail
          black --check .

  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: actionlint
        uses: rhysd/actionlint@a443f344ff32813837fa49f7aa6cbc478d770e62 # v1.7.9

  workflow-security:
    name: Workflow Security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: actionlint

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        continue-on-error: true
        with:
          inputs: .github/workflows
          persona: auditor
          min-severity: medium
          min-confidence: medium

  dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          recursive: true
          failure-threshold: error

  dependency-review:
    name: Dependency Review (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  test-timescale:
    name: Tests (TimescaleDB pg16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight

    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: apm
          POSTGRES_USER: apm
          POSTGRES_PASSWORD: apm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apm -d apm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      POSTGRES_DB: apm
      POSTGRES_USER: apm
      POSTGRES_PASSWORD: apm
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_TEST_DB: apm_test

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.in

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select CI settings module (committed apm_platform/ci_settings.py)
        run: echo "DJANGO_SETTINGS_MODULE=apm_platform.ci_settings" >> "$GITHUB_ENV"

      - name: Install postgres client tools (for diagnostics)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for DB + print DB diagnostics
        run: |
          set -euxo pipefail
          pg_isready -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"
          psql "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" -c "select version();"
          psql "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" -c "show shared_preload_libraries;"
          psql "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" -c "create extension if not exists timescaledb;"

      - name: Apply migrations (Timescale)
        run: |
          set -euxo pipefail
          python manage.py migrate --noinput --verbosity 2 2>&1 | tee migrate-timescale.log

      - name: Show migrations plan (Timescale)
        run: |
          set -euxo pipefail
          python manage.py showmigrations --plan 2>&1 | tee showmigrations-timescale.log

      - name: Run tests (Timescale)
        run: |
          set -euxo pipefail
          python manage.py test -v 2 2>&1 | tee test-timescale.log

      - name: Seed sample data
        run: |
          set -euxo pipefail
          python manage.py seed_apirequests --count 500 --days 1 2>&1 | tee seed-timescale.log

      - name: Data quality gate
        run: |
          set -euxo pipefail
          python manage.py check_data_quality --fail-on-empty 2>&1 | tee dataquality-timescale.log

      - name: Upload logs (Timescale) on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timescale-logs
          path: |
            migrate-timescale.log
            showmigrations-timescale.log
            test-timescale.log
            seed-timescale.log
            dataquality-timescale.log

  demo-sql:
    name: Demo SQL (Timescale script)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight

    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: apm
          POSTGRES_USER: apm
          POSTGRES_PASSWORD: apm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apm -d apm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      POSTGRES_DB: apm
      POSTGRES_USER: apm_app
      POSTGRES_PASSWORD: apm_app_pass
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install postgres client tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Bootstrap roles and extension (superuser)
        env:
          POSTGRES_USER: apm
          POSTGRES_PASSWORD: apm
        run: |
          set -euxo pipefail
          psql "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" -c "create extension if not exists timescaledb;"
          psql "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" -f docker/initdb/001_roles.sql

      - name: Wait for DB ready
        run: |
          set -euxo pipefail
          pg_isready -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"

      - name: Run demo SQL script
        run: |
          set -euxo pipefail
          psql "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" -f scripts/db_quick_demo.sql

      - name: Upload demo SQL output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-sql-logs
          path: |
            scripts/db_quick_demo.sql

  docker-compose-smoke:
    name: Docker Compose smoke (build + migrate + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: preflight

    env:
      COMPOSE_PROJECT_NAME: apm-ci

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Docker diagnostics
        run: |
          set -euxo pipefail
          docker version
          docker compose version
          docker buildx version
          docker buildx ls

      - name: Prepare CI env
        run: |
          set -euxo pipefail
          cp .env.docker .env.docker.ci
          sed -i 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-not-secret/' .env.docker.ci
          sed -i 's/^DJANGO_DEBUG=.*/DJANGO_DEBUG=0/' .env.docker.ci
          {
            echo "DJANGO_SETTINGS_MODULE=apm_platform.ci_settings"
            echo "POSTGRES_HOST=db"
            echo "POSTGRES_PORT=5432"

            # Reduce any accidental runtime overhead if web ever starts
            echo "GUNICORN_WORKERS=1"
            echo "GUNICORN_TIMEOUT=60"
          } >> .env.docker.ci

      - name: Compose config (debug)
        run: |
          set -euxo pipefail
          docker compose -f docker/docker-compose.yml --env-file .env.docker.ci config --services

      - name: Build image (web)
        run: |
          set -euxo pipefail
          docker compose -f docker/docker-compose.yml --env-file .env.docker.ci build web

      - name: Start DB only
        run: |
          set -euxo pipefail
          docker compose -f docker/docker-compose.yml --env-file .env.docker.ci up -d db
          docker compose -f docker/docker-compose.yml --env-file .env.docker.ci ps

      - name: Wait for DB ready (pg_isready)
        run: |
          set -euxo pipefail
          for i in {1..40}; do
            if docker compose -f docker/docker-compose.yml --env-file .env.docker.ci exec -T db \
              pg_isready -h 127.0.0.1 -p 5432 -U "${POSTGRES_USER:-apm}" -d "${POSTGRES_DB:-apm}" >/dev/null 2>&1; then
              echo "DB is ready"
              exit 0
            fi
            echo "Waiting for DB... ($i/40)"
            sleep 2
          done
          echo "DB never became ready"
          docker compose -f docker/docker-compose.yml --env-file .env.docker.ci logs db --tail=200 || true
          exit 1

      - name: Bootstrap DB (extension + roles)
        run: |
          set -euxo pipefail
          docker compose -f docker/docker-compose.yml --env-file .env.docker.ci exec -T db \
            psql -U apm -d apm -c "create extension if not exists timescaledb;"
          docker compose -f docker/docker-compose.yml --env-file .env.docker.ci exec -T db \
            psql -U apm -d apm -f /docker-entrypoint-initdb.d/001_roles.sql
          docker compose -f docker/docker-compose.yml --env-file .env.docker.ci exec -T db \
            psql -U apm -d apm -c "alter role apm_app createdb;"

      - name: Run checks + migrate + tests (one-off web container)
        run: |
          set -euxo pipefail
          docker compose -f docker/docker-compose.yml --env-file .env.docker.ci run --rm --no-deps \
            -e DJANGO_SETTINGS_MODULE=apm_platform.ci_settings \
            --entrypoint bash web -lc "
              python manage.py check &&
              python manage.py migrate --noinput --verbosity 2 &&
              python manage.py showmigrations --plan &&
              python manage.py test -v 2
            "

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --env-file .env.docker.ci logs --no-color > compose.log || true
          docker compose -f docker/docker-compose.yml --env-file .env.docker.ci ps || true
          free -m || true
          docker stats --no-stream || true

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-compose-logs
          path: compose.log

      - name: Shutdown
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml --env-file .env.docker.ci down -v --remove-orphans || true

  pip-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.in

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        run: |
          set -euxo pipefail
          pip-audit -r requirements.txt

      - name: Generate pip-audit JSON
        if: always()
        run: |
          set -euxo pipefail
          pip-audit -r requirements.txt -f json -o pip-audit.json || true

      - name: Generate Python dependency SBOM
        if: always()
        run: |
          set -euxo pipefail
          pip-audit -r requirements.txt -f cyclonedx-json -o pip-audit.cdx.json || true

      - name: Upload dependency audit artifacts
        if: always() && hashFiles('pip-audit.json', 'pip-audit.cdx.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit
          path: |
            pip-audit.json
            pip-audit.cdx.json

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight

    # Measure coverage against TimescaleDB (not SQLite): the PostgreSQL-only
    # analytics tests (KPIs, hourly/daily aggregates, top-endpoints, RLS) skip on
    # SQLite, so measuring there both understates coverage and inflates the skip
    # count. Running on Timescale exercises those paths for real.
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: apm
          POSTGRES_USER: apm
          POSTGRES_PASSWORD: apm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apm -d apm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    env:
      POSTGRES_DB: apm
      POSTGRES_USER: apm
      POSTGRES_PASSWORD: apm
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_TEST_DB: apm_test

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements.in

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Select CI settings module (committed apm_platform/ci_settings.py)
        run: echo "DJANGO_SETTINGS_MODULE=apm_platform.ci_settings" >> "$GITHUB_ENV"

      - name: Install postgres client + enable extension
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_isready -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"
          psql "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}" -c "create extension if not exists timescaledb;"

      - name: Apply migrations (Timescale)
        run: |
          set -euxo pipefail
          python manage.py migrate --noinput

      - name: Run tests under coverage
        run: |
          set -euxo pipefail
          coverage run manage.py test -v 2
          # Produce the XML artifact BEFORE the enforcing report, so the upload
          # step still has a file even when the fail_under gate trips.
          coverage xml
          coverage report   # enforces .coveragerc fail_under (may fail the gate)

      - name: Coverage summary → job summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo '```'
            coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml

  ci-status:
    name: CI Status (quality gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - preflight
      - lint
      - format-check
      - actionlint
      - workflow-security
      - dockerfile-lint
      - dependency-review
      - test-timescale
      - demo-sql
      - docker-compose-smoke
      - pip-audit
      - coverage
    if: always()

    steps:
      - name: Summarize job graph
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          allowed = {"success", "skipped"}
          failed = {
              name: meta["result"]
              for name, meta in needs.items()
              if meta["result"] not in allowed
          }

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## CI job graph\n\n")
              summary.write("| Job | Result |\n| --- | --- |\n")
              for name, meta in sorted(needs.items()):
                  summary.write(f"| `{name}` | `{meta['result']}` |\n")

          if failed:
              print("Failing required jobs:", failed)
              sys.exit(1)
          PY
