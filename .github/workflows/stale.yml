name: Stale issues and PRs

# House-keeping: flag issues/PRs with no activity, then close them if still
# untouched. Anything labelled pinned/security is exempt.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,roadmap"
          exempt-pr-labels: "pinned,security,dependencies"
          stale-issue-message: >
            This issue has had no activity for 60 days and will be closed in 14
            days if nothing further happens. Comment to keep it open.
          stale-pr-message: >
            This PR has had no activity for 60 days and will be closed in 14 days
            if nothing further happens. Push a commit or comment to keep it open.
