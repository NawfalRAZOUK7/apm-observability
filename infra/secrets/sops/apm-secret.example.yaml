# Template for a SOPS-encrypted app Secret. Copy to apm-secret.enc.yaml, fill in
# real values, then encrypt IN PLACE:  sops --encrypt --in-place apm-secret.enc.yaml
# Commit ONLY the encrypted file. Apply with the helm-secrets plugin or:
#   sops --decrypt apm-secret.enc.yaml | kubectl apply -f -
# then deploy the chart with --set existingSecret=apm-secret.
apiVersion: v1
kind: Secret
metadata:
  name: apm-secret
  namespace: apm
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
