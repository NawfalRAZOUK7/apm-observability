# SOPS creation rules (Phase 15). Encrypts *.enc.yaml with age. Replace the
# recipient with your team's age public key(s): `age-keygen -o key.txt`.
creation_rules:
  - path_regex: .*\.enc\.yaml$
    encrypted_regex: "^(data|stringData|.*_KEY|.*_PASSWORD|.*_TOKEN)$"
    age: >-
      age1q]REPLACE_WITH_YOUR_AGE_PUBLIC_KEY
