# A $0 SecretStore backed by the Kubernetes API itself: External Secrets reads
# from a source Secret in another namespace. Useful to demonstrate the pattern
# locally without a cloud secret manager. For production, use the AWS/Vault store.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: k8s-store
  namespace: apm
spec:
  provider:
    kubernetes:
      remoteNamespace: apm-secrets-source
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets-reader
