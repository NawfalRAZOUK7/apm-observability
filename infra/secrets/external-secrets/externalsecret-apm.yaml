# Syncs the app's secrets from the store into a native k8s Secret named
# `apm-secret`. Deploy the chart with `--set existingSecret=apm-secret` so it
# consumes this instead of creating its own. Rotation in the store propagates
# automatically on the refreshInterval.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: apm-secret
  namespace: apm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager # or k8s-store for the local demo
    kind: SecretStore
  target:
    name: apm-secret
    creationPolicy: Owner
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: apm/observability
        property: django_secret_key
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: apm/observability
        property: postgres_password
