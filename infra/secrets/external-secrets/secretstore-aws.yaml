# Production SecretStore backed by AWS Secrets Manager. The pod's IAM role
# (IRSA) grants read access; no static credentials. Reference — needs AWS.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: apm
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-irsa
