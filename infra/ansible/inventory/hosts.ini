# Single-host LAN example (SSH)
# - For local runs, keep ansible_connection=local.
# - For SSH, remove ansible_connection and set ansible_user/ansible_host/ansible_port.

[apm_nodes]
apm-node ansible_host=192.0.2.10 ansible_user=apm ansible_port=22

[data]
apm-node

[control]
apm-node

[app]
apm-node

[all:vars]
ansible_python_interpreter=/usr/bin/python3
repo_path=/opt/apm-observability
docker_bin=/usr/local/bin/docker
cluster_env_overwrite=false
