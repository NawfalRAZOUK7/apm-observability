apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-nonroot-hardening
  annotations:
    policies.kyverno.io/title: Require non-root + drop capabilities
    policies.kyverno.io/category: Pod Security Standards (restricted)
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              # Trusted infrastructure namespaces -- these rules target THIS app's
              # workloads, not the platform underneath it. Enforcing them cluster-wide
              # blocks the components this repo itself installs (infra/terraform/modules):
              # argo-rollouts ships from quay.io, kube-prometheus-stack/loki run root
              # sidecars, and dynamic volume provisioners (kind's rancher.io/local-path)
              # run short-lived root, probe-less helper pods -- which stalls EVERY PVC in
              # the cluster at Pending. Add your cluster's own infra namespaces here.
              namespaces:
                - kube-system
                - kyverno
                - local-path-storage
                - argo-rollouts
                - external-secrets
                - monitoring
      validate:
        message: "Containers must run as non-root, drop ALL capabilities, and disable privilege escalation."
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
