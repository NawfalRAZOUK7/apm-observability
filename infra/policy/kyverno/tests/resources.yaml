---
# Job-owned pod with NO probes (mirrors the chart's migrate hook). Probes are for
# long-running workloads; a run-to-completion pod must not define them, so
# require-probes skips it via its ownerReferences precondition. Otherwise fully
# compliant, so the remaining policies still apply.
apiVersion: v1
kind: Pod
metadata:
  name: migrate-job-pod
  namespace: apm
  ownerReferences:
    - apiVersion: batch/v1
      kind: Job
      name: apm-migrate
      uid: 00000000-0000-0000-0000-000000000001
      controller: true
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
  containers:
    - name: migrate
      image: ghcr.io/nawfalrazouk7/apm-observability:v1.0.0
      command: ["python", "manage.py", "migrate", "--noinput"]
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests: { cpu: "100m", memory: "256Mi" }
        limits: { cpu: "1", memory: "512Mi" }
