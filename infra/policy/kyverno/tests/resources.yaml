# Test fixtures for `kyverno test` (Phase 16). Each "bad" pod is otherwise
# compliant and violates exactly one policy.
---
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: apm
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: web
      image: ghcr.io/nawfalrazouk7/apm-observability:v1.0.0
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests: { cpu: "100m", memory: "256Mi" }
        limits: { cpu: "1", memory: "512Mi" }
      readinessProbe:
        httpGet: { path: /api/health/, port: 8000 }
      livenessProbe:
        httpGet: { path: /api/health/, port: 8000 }
